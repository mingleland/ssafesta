openapi: 3.1.0
info:
  title: Spring Daily Mission Marker API for AI
  version: 0.1.0
  description: |
    FastAPI가 Conversation 생성에 성공한 직후 Spring에 알리는 경로다 (spec 022 FR-003a,
    S15P21A604-955). 일일 미션 `AI_CONSULT`의 **유일한 사실 근거**다 — 대화 트래픽은
    nginx가 `/ai/v1/**`에서 FastAPI로 바로 보내므로 이 통보가 없으면 Spring에는 회원이
    AI 직원과 대화했다는 기록이 남지 않는다.

    **Booth Access와 달리 Fail Closed가 아니다.** 이 호출이 실패해도 FastAPI는 대화를
    성공으로 반환하고 경고 로그만 남긴다(FR-004a). 미션 하나 때문에 대화를 막지 않는다.
    재시도도 하지 않는다 — 회원이 다시 말을 걸면 그때 다시 통보된다.

    **멱등하다.** Spring은 `mission:ai-consult:{userId}:{KST 일자}` 키를 `setIfAbsent`로
    쓰고 TTL을 다음 KST 자정까지 둔다. 같은 날 몇 번을 통보해도 진행도는 1/1이다.

    `userId`는 클라이언트가 주장한 값이 아니다. FastAPI가 회원 Access Token을 검증해
    얻은 식별자이며, 사용자 토큰으로는 `/internal/**`이 열리지 않는다.
servers:
  - url: /internal/ai
security:
  - serviceToken: []
paths:
  /mission/ai-consult:
    post:
      operationId: markAiConsultMission
      summary: 회원이 AI 직원과 대화를 시작했다는 사실 기록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiConsultMarkRequest'
      responses:
        '204':
          description: 마커 기록됨 — 같은 KST 일자의 재통보도 204다
        '400':
          description: |
            `userId`가 없거나 null이거나 양수가 아니다. 계약에 없는 필드를 보낸 경우도
            같은 응답이다 — 무시된 필드를 2xx로 돌려주면 보낸 쪽이 반영됐다고 읽는다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: Service Token 실패
        '503':
          description: |
            Redis에 기록하지 못했다 (`MISSION_PROGRESS_UNAVAILABLE`). FastAPI는 이 응답을
            받아도 대화를 실패시키지 않는다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token
      description: |
        FastAPI → Spring 방향이므로 `INTERNAL_AI_TO_SPRING_TOKENS`를 쓴다
        (GitLab #102, 2026-08-25 확정 — 방향별 2토큰).
        Spring → FastAPI 방향 토큰(`INTERNAL_SPRING_TO_AI_TOKENS`)을 여기 실으면 401이다.
  schemas:
    AiConsultMarkRequest:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId:
          type: integer
          format: int64
          minimum: 1
          description: FastAPI가 회원 Access Token에서 검증해 얻은 식별자.

    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
