openapi: 3.1.0
info:
  title: SSAFY FESTA Spring Internal AI Document Status API
  version: 0.5.0
  description: FastAPI가 AI DB 커밋 이후 처리 결과를 Spring 소유 Business DB의 DocumentStatus에 반영하는 내부 콜백 계약이다. 두 DB를 분산 트랜잭션으로 묶지 않으며 callback 멱등성으로 수렴한다.
servers:
  - url: /internal/ai
security:
  - serviceToken: []
paths:
  /documents/{documentId}/status:
    patch:
      operationId: updateDocumentProcessingStatus
      summary: AI 문서 상태 결과 반영
      description: Spring이 처리 요청 응답으로 저장한 jobId만 허용하며, 동일 jobId와 status의 반복 요청은 멱등하게 성공해야 한다.
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentStatusUpdateRequest'
      responses:
        '204':
          description: 신규 또는 중복 상태 반영 성공
        '409':
          description: sourceHash가 현재 문서 개정본과 달라 오래된 결과를 적용하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 원인 코드에 따라 미등록 Job, 삭제된 문서, Job-문서 불일치를 구분함
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: AI→Spring Service Token 누락·오류 또는 반대 방향 토큰 사용
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token
      description: INTERNAL_AI_TO_SPRING_TOKENS의 첫 값을 FastAPI/Worker가 송신하고 Spring이 목록 전체를 상수 시간으로 검증한다.
  schemas:
    DocumentStatus:
      type: string
      enum: [QUEUED, PROCESSING, READY, FAILED, DISABLED]
    DocumentStatusUpdateRequest:
      type: object
      additionalProperties: false
      required: [jobId, status, sourceHash, occurredAt]
      properties:
        jobId:
          type: string
          pattern: '^job_[0-9]+$'
        status:
          $ref: '#/components/schemas/DocumentStatus'
        sourceHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        chunkCount:
          type: [integer, 'null']
          minimum: 0
        failureCode:
          type: [string, 'null']
          enum: [PARSE_FAILED, UNSUPPORTED_SCAN_PDF, EMBEDDING_TIMEOUT, SOURCE_NOT_FOUND, SOURCE_HASH_MISMATCH, PROCESSING_INTERRUPTED, INTERNAL_ERROR, null]
          description: SOURCE_HASH_MISMATCH는 FastAPI가 다운로드한 원본 바이트의 SHA-256이 처리 요청 sourceHash와 다를 때 사용한다.
        failureReason:
          type: [string, 'null']
          maxLength: 500
          description: 사용자 노출 가능한 정제 메시지
        processedAt:
          type: [string, 'null']
          format: date-time
        occurredAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [JOB_NOT_REGISTERED, DOCUMENT_NOT_FOUND, JOB_DOCUMENT_MISMATCH, STALE_SOURCE_HASH]
          description: JOB_NOT_REGISTERED만 1초·3초·10초 최대 3회 재시도하며, 나머지 404는 재시도하지 않는다.
        message:
          type: string
