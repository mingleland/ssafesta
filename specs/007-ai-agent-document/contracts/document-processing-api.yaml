openapi: 3.1.0
info:
  title: SSAFY FESTA AI Document Processing API
  version: 0.6.0
  description: Spring이 영속 Job을 만든 뒤 DB 권한이 없는 FastAPI에 문서 처리를 시작시키는 계약이다.
servers:
  - url: /ai/v1
security:
  - serviceToken: []
paths:
  /documents/process:
    post:
      operationId: startDocumentProcessing
      summary: 영속 Job의 문서 처리 시작
      description: FastAPI는 비동기 처리를 시작하고 DB에 Job을 만들지 않는다. 같은 jobId+attemptNo 재전송은 중복 Worker 없이 멱등하게 수락한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessDocumentRequest'
      responses:
        '202':
          description: 비동기 처리 수락
        '422':
          description: 요청 형식·크기 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Spring→FastAPI Service Token 누락·오류
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token
  schemas:
    ProcessDocumentRequest:
      type: object
      additionalProperties: false
      required: [jobId, attemptNo, documentId, boothId, agentId, originalFilename, contentType, fileSizeBytes, storageProvider, storageBucket, objectKey, sourceHash]
      properties:
        jobId: {type: integer, format: int64, minimum: 1}
        attemptNo: {type: integer, minimum: 0}
        documentId: {type: integer, format: int64, minimum: 1}
        boothId: {type: integer, format: int64, minimum: 1}
        agentId: {type: integer, format: int64, minimum: 1}
        originalFilename: {type: string, minLength: 1, maxLength: 255}
        contentType:
          type: string
          enum: [application/pdf, text/markdown, text/plain]
        fileSizeBytes: {type: integer, minimum: 1, maximum: 20971520}
        storageProvider:
          type: string
          enum: [R2, MINIO_LOCAL]
        storageBucket: {type: string, minLength: 1}
        objectKey: {type: string, minLength: 1}
        sourceHash: {type: string, pattern: '^[a-f0-9]{64}$'}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
