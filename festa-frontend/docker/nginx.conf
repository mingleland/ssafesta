server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 런타임 설정은 캐시하면 안 된다 — 같은 이미지를 다른 PUBLIC_API_BASE_URL로 재실행했을 때
    # 브라우저가 옛 값을 쓰면 주입이 된 것처럼 보이거나 안 된 것처럼 보인다.
    location = /runtime-config.js {
        add_header Cache-Control "no-store" always;
    }

    # SPA fallback — 이것이 없으면 /app/booths 같은 deep link 가 404 다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 도 캐시하지 않는다 — 새 이미지를 배포해도 옛 번들 해시를 가리키게 된다.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }
}
