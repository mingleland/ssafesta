server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 텍스트 자산은 origin 에서도 압축한다 (S15P21A604-847). Cloudflare 가 엣지에서 br 로 다시 압축하므로
    # 브라우저 체감은 없고 origin→엣지 구간과 CF 를 거치지 않는 경로(로컬·직접 접근)만 줄어든다.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 런타임 설정은 캐시하면 안 된다 — 같은 이미지를 다른 PUBLIC_API_BASE_URL로 재실행했을 때
    # 브라우저가 옛 값을 쓰면 주입이 된 것처럼 보이거나 안 된 것처럼 보인다.
    location = /runtime-config.js {
        add_header Cache-Control "no-store" always;
    }

    # assets:build 산출물 — 파일명에 hash 가 없어 장기 캐시를 걸면 자산 재생성 뒤 옛 GLB 가 남는다.
    # `^~` 로 아래 /assets/ 보다 먼저 잡는다. `types` 는 상속이 아니라 통째 대체라 mime.types 를 다시
    # 포함해야 같은 경로의 webp·json 이 octet-stream 으로 떨어지지 않는다. nginx:alpine 의 mime.types 에는
    # glb 가 없어(1.31.6 실측) 여기서 직접 붙인다.
    location ^~ /assets/booth-runtime/ {
        include /etc/nginx/mime.types;
        types { model/gltf-binary glb; }
        add_header Cache-Control "no-cache" always;
    }

    # Vite 산출물 — 파일명이 content hash 라 1년 immutable 이 안전하다. 없는 해시는 404 여야 한다:
    # SPA fallback 이 index.html 을 200 으로 돌려주면 배포 직후 열린 탭이 옛 chunk 를 요청했을 때
    # "text/html 을 module script 로 받았다" 는 오류만 남고 원인이 보이지 않는다(LJH T-119).
    # 여기만 `always` 를 뺀다 — 404 에 1년 immutable 이 붙으면 배포 교체 순간의 404 를 엣지가 1년 들고 간다.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback — 이것이 없으면 /app/booths 같은 deep link 가 404 다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 은 매번 재검증한다 — 새 이미지를 배포해도 옛 번들 해시를 가리키면 안 된다.
    # no-store 가 아니라 no-cache 인 이유: ETag 로 304 를 받을 수 있고, 저장 자체를 막을 이유가 없다.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
}
