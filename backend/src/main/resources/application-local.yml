spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ssafesta}
    username: ${POSTGRES_USER:ssafesta}
    password: ${POSTGRES_PASSWORD:change-me-local-only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email
            redirect-uri: ${GOOGLE_REDIRECT_URI}
          kakao:
            client-id: ${KAKAO_REST_API_KEY}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: ${KAKAO_REDIRECT_URI}
            scope: profile_nickname, account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:
  auth:
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: PT30M
    refresh-token-ttl: P7D
    oauth-state-ttl: PT5M
    refresh-cookie-path: /api/v1/auth/refresh
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    # HTTP localhost test only. Set AUTH_COOKIE_SECURE=true in HTTPS deployment.
    cookie-secure: ${AUTH_COOKIE_SECURE:false}

  wallet:
    initial-grant: 200
    daily-grant: 50
    daily-grant-zone: Asia/Seoul

  # Unity 월드 접속 정보 (spec 002 FR-010). 배포 환경은 wss / world.<domain> / 443 이며
  # 그 값은 infra-003 의 application-infra.yml 이 소유한다 — 여기 값을 쓰지 않는다.
  world:
    scheme: ${WORLD_SCHEME:ws}
    host: ${WORLD_HOST:127.0.0.1}
    port: ${WORLD_PORT:7777}
    # Access Token 키(jwt-secret)와 분리된 전용 키. 게임 서버가 이 키로 서명을 자체 검증한다
    # (헌법 14조). jwt-secret 과 같이 기본값을 두지 않는다 — 없으면 기동이 실패해야 한다.
    connection-token-secret: ${CONNECTION_TOKEN_SECRET}

  lease:
    price-coin: 100
    duration: PT24H

  # spec 019 — 계정당 게임 상한. 둘은 독립이라 서로 잠식하지 않는다.
  # 삭제본이 무제한이면 활성 20을 지키면서 최대 2MB Draft를 무한히 쌓을 수 있어 함께 둔다.
  # 개수로 유계이므로 보관 기간과 sweeper가 필요 없다 — 밀어내기가 삭제 트랜잭션 안에서 끝난다.
  game:
    live-limit: 20
    deleted-limit: 5

  # 내부 API 인증 (GitLab #102, 2026-08-25 확정 — 방향별 2토큰). 콤마 구분 1~2개이고
  # 송신은 첫 값, 검증은 목록 전체다. jwt-secret 과 같이 기본값을 두지 않는다 — 기본값이 있으면
  # 배포에서 env 를 빠뜨렸을 때 공개된 토큰으로 조용히 뜬다.
  # 여기는 FastAPI→Spring 수신분만 둔다. Spring→FastAPI 송신분은 S15P21A604-175 몫이다.
  internal:
    ai-to-spring-tokens: ${INTERNAL_AI_TO_SPRING_TOKENS}

  # spec 007 C-13·FR-018. per-booth-limit 은 V15 ux_ai_agents_booth 와 짝이라 1 이 아니면
  # 기동이 실패한다 — 올리려면 인덱스 drop 마이그레이션을 함께 낸다.
  # 뒤 둘은 S15P21A604-106(Document 업로드)이 소비할 자리다.
  agent:
    per-booth-limit: 1
    document-count-limit: 10
    document-total-bytes: 100MB
