INTERNAL_AI_TO_SPRING_TOKENS=test-ai-to-spring
# 두 방향 토큰은 서로 달라야 한다 — AI 쪽이 겹치는 설정으로는 기동하지 않는다.
INTERNAL_SPRING_TO_AI_TOKENS=test-spring-to-ai
# 죽은 포트. 통합 테스트는 DocumentProcessingClient 를 가짜로 갈아끼우므로 실제로 붙지 않는다.
AI_INTERNAL_BASE_URL=http://localhost:9

# 문서 저장소 설정에는 기본값이 없어서(운영에서 빠뜨리면 기동이 실패해야 한다) 테스트도
# 값을 공급해야 컨텍스트가 뜬다. 실제로 부르지는 않는다 — 통합 테스트는 AiDocumentStorage
# 를 가짜로 갈아끼우고, presign 은 네트워크 없이 서명만 한다.
# 업로드 게이트에는 기본값이 없다 — 오타로 차단이 열리지 않게 한 것이라 테스트도 값을 준다.
AI_STORAGE_UPLOAD_GATE=OPEN

R2_ENDPOINT=http://localhost:9
R2_BUCKET=test-ai-documents
R2_ACCESS_KEY_ID=test-access-key
R2_SECRET_ACCESS_KEY=test-secret-key

# 테스트에서는 임대 만료 배치를 스케줄로 돌리지 않는다 — 만료를 흉내내는 픽스처(ends_at 을
# 과거로 미는 테스트가 여러 개다)가 배치와 겹치면 ACTIVE 를 단정하는 테스트가 간헐 실패한다.
# 배치 자체는 BoothLeaseExpirySweeperIntegrationTest 가 직접 호출해 검증한다.
app.lease.expiry-scan-interval=PT24H
