# 서명 키 2종에는 기본값이 없어서(배포에서 빠뜨리면 기동이 실패해야 한다) 테스트도 값을
# 공급해야 컨텍스트가 뜬다. base64 여야 한다 — 평문이면 JwtConfiguration 이 디코드하다
# "Illegal base64 character" 로 죽는다. 값은 ci/test 와 같은 더미(64바이트)이고, 두 키는
# 서로 달라야 한다 — 게임 서버가 쥐는 키로 Access Token 이 발급되면 안 된다 (헌법 14조).
JWT_SECRET=YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYQ==
CONNECTION_TOKEN_SECRET=YmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYg==

# OAuth 3사 등록에도 기본값이 없다 — 빠지면 ClientRegistration 바인딩에서 기동이 실패한다.
# 전부 더미다. 통합 테스트는 인가 서버에 붙지 않고 리디렉트 URL 조립만 확인한다.
GOOGLE_CLIENT_ID=test-google-client-id
GOOGLE_CLIENT_SECRET=test-google-client-secret
GOOGLE_REDIRECT_URI=http://localhost:8080/login/oauth2/code/google
KAKAO_REST_API_KEY=test-kakao-rest-api-key
KAKAO_CLIENT_SECRET=test-kakao-client-secret
KAKAO_REDIRECT_URI=http://localhost:8080/login/oauth2/code/kakao
SSAFY_CLIENT_ID=test-ssafy-client-id
SSAFY_CLIENT_SECRET=test-ssafy-client-secret
SSAFY_REDIRECT_URI=http://localhost:8080/login/oauth2/code/ssafy

INTERNAL_AI_TO_SPRING_TOKENS=test-ai-to-spring
# 세 집합의 토큰은 서로 달라야 한다 — 겹치면 InternalTokenProperties 가 기동을 막는다.
INTERNAL_SPRING_TO_AI_TOKENS=test-spring-to-ai
INTERNAL_INFRA_TO_SPRING_TOKENS=test-infra-to-spring
# 죽은 포트. 통합 테스트는 DocumentProcessingClient 를 가짜로 갈아끼우므로 실제로 붙지 않는다.
AI_INTERNAL_BASE_URL=http://localhost:9

# 문서 저장소 설정에는 기본값이 없어서(운영에서 빠뜨리면 기동이 실패해야 한다) 테스트도
# 값을 공급해야 컨텍스트가 뜬다. 실제로 부르지는 않는다 — 통합 테스트는 AiDocumentStorage
# 를 가짜로 갈아끼우고, presign 은 네트워크 없이 서명만 한다.
# 업로드 게이트에는 기본값이 없다 — 오타로 차단이 열리지 않게 한 것이라 테스트도 값을 준다.
AI_STORAGE_UPLOAD_GATE=OPEN

R2_ENDPOINT=http://localhost:9
R2_BUCKET=test-ai-documents
R2_ACCESS_KEY_ID=test-access-key
R2_SECRET_ACCESS_KEY=test-secret-key

# 테스트에서는 임대 만료 배치를 스케줄로 돌리지 않는다 — 만료를 흉내내는 픽스처(ends_at 을
# 과거로 미는 테스트가 여러 개다)가 배치와 겹치면 ACTIVE 를 단정하는 테스트가 간헐 실패한다.
# 배치 자체는 BoothLeaseExpirySweeperIntegrationTest 가 직접 호출해 검증한다.
app.lease.expiry-scan-interval=PT24H
# 만료 1시간 전 fixture도 여러 통합 테스트가 만들 수 있다. 스케줄러가 자동으로 보내면 Mockito
# 호출 수와 DB 상태 단정이 흔들리므로, 알림 배치는 전용 통합 테스트에서만 직접 호출한다.
app.lease.expiry-warning-scan-interval=PT24H

# 정합성 점검 배치도 같은 이유로 스케줄로 돌리지 않는다 — 전체 스위트가 기본 지연 5분을 넘기면
# 최초 실행이 끼어들어 실행 횟수를 세는 테스트(everyRunIsRecorded)가 흔들린다. 등록 여부와
# 배치 자체는 CoinReconciliationIntegrationTest 가 각각 검증한다.
app.wallet.reconciliation-initial-delay=PT24H
app.wallet.reconciliation-scan-interval=PT24H
