# SSAFY FESTA — CI 파이프라인
#
# Jira 상태 전이는 GitLab Project Webhook → Jira Automation이 담당한다.
# 이 파일의 jira-* job은 이관 전 기록으로만 남기며 실행하지 않는다.
# GitLab CI는 develop 대상 MR의 병합 전 gate를 담당한다. Jenkins는 develop 병합 뒤 빌드·배포를 담당한다.
#
# 워크플로 문서: docs/jira-gitlab-workflow.md
#
# 필요한 CI/CD Variables (Settings → CI/CD → Variables, Masked):
#   JIRA_SYNC_EMAIL — Jira 계정 이메일
#   JIRA_SYNC_TOKEN — Atlassian API 토큰 (값은 절대 저장소에 넣지 않는다)
# 두 변수가 없으면 sync 잡은 경고만 남기고 통과한다 (개발을 막지 않는다).

workflow:
  rules:
    # develop 대상 MR gate: 소스 브랜치 명명규칙과 무관하게 파이프라인을 항상 생성한다 (GitLab #220 Phase 1).
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'

    # develop → main Production Promotion MR gate: develop에서 main으로의 승격 MR에도 pre-merge 파이프라인을 생성한다.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'

    # ⚠️ 긴급 규약 (2026-09-15, S15P21A604-185) — 파트 브랜치(ai/back/front/game) 대상 MR 에도
    # 파이프라인을 만든다. develop 머지 슬롯이 동시 2개뿐이라 한 건씩 줄 서는 것이 병목이어서,
    # 각 파트가 자기 브랜치에 모아 둔 뒤 한 번에 develop 으로 올리기로 했다.
    #
    # 설정으로는 못 푼다 — "Pipelines must succeed" 는 프로젝트 전체 스위치라 target 별로 끌 수
    # 없고, 끄면 develop·main 까지 같이 풀린다. 그래서 파트 브랜치 MR 에는 mr-status 하나만 도는
    # 가벼운 파이프라인을 띄워 머지 체크를 만족시킨다. 컴포넌트 CI 와 Unity 검증은 아래
    # .{ai,back,front,game}-changes 가 develop 대상일 때만 돌리므로 이 구간에 남는 검사는
    # secret-scan 하나다.
    #
    # 대가를 적어 둔다: 파트 브랜치 구간은 코드 검증이 0회다. 그 파트의 develop MR 이 첫 검증이
    # 되고, 거기서 터지면 어느 작업이 원인인지 좁히기 어렵다. 오래 끌수록 그 비용이 커진다.
    #
    # 해제 조건 — 둘 중 하나라도 성립하면 이 rule 과 .*-changes 의 target 가드를 함께 지운다.
    #   1. 러너 동시 실행 한도가 늘어 develop 직행이 다시 감당된다
    #   2. 파트 브랜치 배칭을 끝내고 develop 직행으로 돌아간다
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(?:ai|back|front|frontend.*|game)$/'

    # 위 둘에 해당하지 않으면 파이프라인을 만들지 않는다. 브랜치 push 도 여기서 멈춘다 — MR
    # 파이프라인과 중복 실행하지 않기 위해서다.
    - when: never

stages:
  - validate
  - test
  - build

variables:
  JENKINS_UNITY_VALIDATION_JOB: "festa-unity-mr-validation"

.component-ci:
  interruptible: true
  before_script:
    - command -v python3 >/dev/null || (apt-get update && apt-get install -y --no-install-recommends python3 && rm -rf /var/lib/apt/lists/*)
    - export CI_BRANCH="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-$CI_COMMIT_REF_NAME}"
    - export CI_RUN_ID="${CI_PIPELINE_ID}-${CI_JOB_ID}"
    - export CI_ARTIFACT_DIR="${CI_PROJECT_DIR}/artifacts/${CI_JOB_NAME}"
    - mkdir -p "$CI_ARTIFACT_DIR"
  # 리포트를 올려 두고도 파싱하지 않으면 MR 화면의 test_report 가 빈 결과로 남는다. ai 가
  # --junitxml 로 만들던 tests.xml 이 그 상태였다. 여기 한 곳에 걸어 back·ai 를 함께 덮는다.
  # front·game 은 매칭되는 파일이 없어 경고만 뜨고 job 은 실패하지 않는다 (GitLab #190).
  artifacts:
    when: always
    paths:
      - artifacts/
    reports:
      junit:
        - artifacts/*/TEST-*.xml
        - artifacts/*/tests.xml

# A valid MR must always publish a successful pipeline status so protected
# develop does not treat an infra/docs-only MR as a skipped pipeline.
mr-status:
  stage: validate
  image: alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apk add --no-cache bash python3 curl jq git
  script:
    - bash infra/jenkins/scripts/secret-scan.sh --path .
    - |
      # CI/Infra 변경이 있을 때만 정적·계약 테스트를 수행한다 (Batch 2 최적화 — 무관한 컴포넌트 빌드 0).
      if git rev-parse --verify origin/develop >/dev/null 2>&1; then
        changed=$(git diff --name-only origin/develop...HEAD 2>/dev/null || git diff --name-only origin/develop..HEAD 2>/dev/null || true)
      else
        changed=$(git diff --name-only HEAD~1 2>/dev/null || true)
      fi
      if printf '%s\n' "$changed" | grep -E '^(infra/|ci/|\.gitlab-ci\.yml|Jenkinsfile)' >/dev/null 2>&1; then
        echo "CI/Infra changes detected — running static contract tests..."
        for t in infra/jenkins/tests/*.sh; do bash "$t"; done
        bash infra/unity-server/tests/run-static.sh
      fi
    - echo 'MR pipeline status only; component CI is selected by rules:changes'

.front-changes:
  rules:
    # 긴급 규약 — 파트 브랜치 대상 MR 에서는 컴포넌트 CI 를 돌리지 않는다 (workflow rules 주석).
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME != "develop"'
      when: never
    - changes:
        compare_to: 'refs/heads/develop'
        paths:
          - festa-frontend/**/*

.front-npm-cache:
  cache:
    key:
      files:
        - festa-frontend/package-lock.json
    paths:
      - festa-frontend/node_modules/

.back-changes:
  rules:
    # 긴급 규약 — develop 대상 MR 에서만 (workflow rules 주석).
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME != "develop"'
      when: never
    - changes:
        compare_to: 'refs/heads/develop'
        paths:
          - backend/**/*

.back-maven-cache:
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  cache:
    key:
      files:
        - backend/pom.xml
        - backend/.mvn/wrapper/maven-wrapper.properties
    paths:
      - .m2/repository/

.ai-changes:
  rules:
    # 긴급 규약 — develop 대상 MR 에서만 (workflow rules 주석).
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME != "develop"'
      when: never
    - changes:
        compare_to: 'refs/heads/develop'
        paths:
          - festa-ai/**/*

.ai-pip-cache:
  cache:
    key:
      files:
        - festa-ai/pyproject.toml
    paths:
      - festa-ai/.venv/

.game-changes:
  rules:
    # 긴급 규약 — develop 대상 MR 에서만 (workflow rules 주석). Unity dispatch 가 Jenkins 를 최대
    # 45분 붙잡으므로 파트 브랜치 구간에서 가장 먼저 빠져야 할 잡이다.
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME != "develop"'
      when: never
    - changes:
        compare_to: 'refs/heads/develop'
        paths:
          - festa-unity/**/*
          - ci/test
          - ci/lib.sh

unity-mr-validation-dispatch:
  extends: .game-changes
  stage: test
  image: alpine:3.20
  timeout: 5m
  before_script:
    - apk add --no-cache curl
  script:
    - |
      : "${JENKINS_UNITY_VALIDATION_URL:?set GitLab CI/CD variable}"
      : "${JENKINS_UNITY_VALIDATION_USER:?set GitLab CI/CD variable}"
      : "${JENKINS_UNITY_VALIDATION_API_TOKEN:?set GitLab CI/CD variable}"
      base_url="${JENKINS_UNITY_VALIDATION_URL%/}"
      headers="$(mktemp)"
      trap 'rm -f "$headers"' EXIT
      curl --fail --silent --show-error --dump-header "$headers" --output /dev/null --request POST \
        --user "${JENKINS_UNITY_VALIDATION_USER}:${JENKINS_UNITY_VALIDATION_API_TOKEN}" \
        --data-urlencode "SOURCE_SHA=${CI_COMMIT_SHA}" \
        --data-urlencode "SOURCE_BRANCH=${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}" \
        --data-urlencode "MR_IID=${CI_MERGE_REQUEST_IID}" \
        "${base_url}/job/${JENKINS_UNITY_VALIDATION_JOB}/buildWithParameters"
      queue_url="$(awk 'BEGIN { IGNORECASE=1 } /^Location:/ { sub(/\r$/, "", $2); print $2 }' "$headers")"
      test -n "$queue_url"
      echo "Jenkins Unity validation dispatched successfully: ${queue_url}"
      echo "Jenkins will post unity-mr-validation commit status callback upon completion."

ai-test:
  extends:
    - .component-ci
    - .ai-changes
    - .ai-pip-cache
  stage: test
  image: python:3.13-slim
  variables:
    CI_COMPONENT: ai
  script:
    - bash ci/test

ai-build:
  extends:
    - .component-ci
    - .ai-changes
    - .ai-pip-cache
  stage: build
  image: python:3.13-slim
  variables:
    CI_COMPONENT: ai
  needs:
    - ai-test
  script:
    - bash ci/build

front-test:
  extends:
    - .component-ci
    - .front-changes
    - .front-npm-cache
  stage: test
  image: node:24-bookworm-slim
  variables:
    CI_COMPONENT: front
  script:
    - bash ci/test

front-build:
  extends:
    - .component-ci
    - .front-changes
    - .front-npm-cache
  stage: build
  image: node:24-bookworm-slim
  variables:
    CI_COMPONENT: front
  needs:
    - front-test
  script:
    - bash ci/build

back-test:
  extends:
    - .component-ci
    - .back-changes
    - .back-maven-cache
  stage: test
  image: maven:3.9-eclipse-temurin-21
  variables:
    CI_COMPONENT: back
    TESTCONTAINERS_HOST_OVERRIDE: 127.0.0.1
  script:
    - bash ci/test

back-build:
  extends:
    - .component-ci
    - .back-changes
    - .back-maven-cache
  stage: build
  image: maven:3.9-eclipse-temurin-21
  variables:
    CI_COMPONENT: back
  needs:
    - back-test
  script:
    - bash ci/build
