# SSAFY FESTA — CI 파이프라인
#
# Jira 상태 전이는 GitLab Project Webhook → Jira Automation이 담당한다.
# 이 파일의 jira-* job은 이관 전 기록으로만 남기며 실행하지 않는다.
# GitLab CI는 develop 대상 MR의 병합 전 gate를 담당한다. Jenkins는 develop 병합 뒤 빌드·배포를 담당한다.
#
# 워크플로 문서: docs/jira-gitlab-workflow.md
#
# 필요한 CI/CD Variables (Settings → CI/CD → Variables, Masked):
#   JIRA_SYNC_EMAIL — Jira 계정 이메일
#   JIRA_SYNC_TOKEN — Atlassian API 토큰 (값은 절대 저장소에 넣지 않는다)
# 두 변수가 없으면 sync 잡은 경고만 남기고 통과한다 (개발을 막지 않는다).

workflow:
  rules:
    # docs/17의 허용 작업 type만 develop 대상 MR gate에 진입시킨다.
    # jira-* job은 아래에서 when: never로 유지해 Jira 내장 연동과 이중 전환하지 않는다.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^(?:feat|feature|fix|refactor|test|docs|chore|build|ci|hotfix|perf)\//'

    # ⚠️ 긴급 규약 (2026-09-15, S15P21A604-185) — 파트 브랜치(ai/back/front/game) 대상 MR 에도
    # 파이프라인을 만든다. develop 머지 슬롯이 동시 2개뿐이라 한 건씩 줄 서는 것이 병목이어서,
    # 각 파트가 자기 브랜치에 모아 둔 뒤 한 번에 develop 으로 올리기로 했다.
    #
    # 설정으로는 못 푼다 — "Pipelines must succeed" 는 프로젝트 전체 스위치라 target 별로 끌 수
    # 없고, 끄면 develop·main 까지 같이 풀린다. 그래서 파트 브랜치 MR 에는 mr-status 하나만 도는
    # 가벼운 파이프라인을 띄워 머지 체크를 만족시킨다. 컴포넌트 CI 와 Unity 검증은 아래
    # .{ai,back,front,game}-changes 가 develop 대상일 때만 돌리므로 이 구간에 남는 검사는
    # secret-scan 하나다.
    #
    # 대가를 적어 둔다: 파트 브랜치 구간은 코드 검증이 0회다. 그 파트의 develop MR 이 첫 검증이
    # 되고, 거기서 터지면 어느 작업이 원인인지 좁히기 어렵다. 오래 끌수록 그 비용이 커진다.
    #
    # 해제 조건 — 둘 중 하나라도 성립하면 이 rule 과 .*-changes 의 target 가드를 함께 지운다.
    #   1. 러너 동시 실행 한도가 늘어 develop 직행이 다시 감당된다
    #   2. 파트 브랜치 배칭을 끝내고 develop 직행으로 돌아간다
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(?:ai|back|front|game)$/'

    # 위 둘에 해당하지 않으면 파이프라인을 만들지 않는다. 브랜치 push 도 여기서 멈춘다 — MR
    # 파이프라인과 중복 실행하지 않기 위해서다.
    - when: never

stages:
  - validate
  - test
  - build
  # - test      # S15P21A604-154: BE(mvn verify)·FE(vitest/build) 잡 예정
  # - build     # 이미지 빌드 잡 예정
  - sync
  # - deploy    # 배포 파이프라인 구축 시 (docs/jira-gitlab-workflow.md §9 TODO)

variables:
  JIRA_SITE: "https://ssafy.atlassian.net"
  JIRA_KEY_REGEX: '[A-Z][A-Z0-9]+-[0-9]+'
  JENKINS_UNITY_VALIDATION_JOB: "festa-unity-mr-validation"

# ──────────────────────────────────────────────────────────────
# validate: develop/main 을 향하는 MR 은 Jira Issue Key 가 필수다.
#   검사 대상: MR 제목 또는 source branch 이름 중 하나.
#   파트 브랜치(ai/back/front/game) 간 MR·직접 push 는 대상이 아니다.
# ──────────────────────────────────────────────────────────────
jira-key-check:
  stage: validate
  image: alpine:3.20
  rules:
    - when: never
  script:
    - |
      echo "MR 제목: $CI_MERGE_REQUEST_TITLE"
      echo "Source branch: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
      if echo "$CI_MERGE_REQUEST_TITLE" | grep -qE "$JIRA_KEY_REGEX"; then
        echo "OK: MR 제목에서 Jira Issue Key 확인"
      elif echo "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" | grep -qE "$JIRA_KEY_REGEX"; then
        echo "OK: source branch 에서 Jira Issue Key 확인"
      else
        echo ""
        echo "ERROR: Jira Issue Key가 존재하지 않습니다."
        echo "develop/main 을 향하는 MR 은 제목 또는 source branch 에 Jira Key 가 있어야 합니다."
        echo "  Branch 예: feat/S15P21A604-123-login"
        echo "  MR 제목 예: [S15P21A604-123][BE] 로그인 기능 구현"
        echo "규칙 문서: docs/jira-gitlab-workflow.md"
        exit 1
      fi

# ──────────────────────────────────────────────────────────────
# sync: GitLab 이벤트 → Jira 상태/라벨 동기화 (실패해도 파이프라인은 통과)
#   보드가 3상태(해야 할 일/진행 중/완료)라 In Review·Ready for Deploy 는
#   라벨(in-review / ready-for-deploy)로 표현한다. Done(완료) 자동 전환은
#   production 배포 파이프라인이 생기기 전까지 수행하지 않는다.
# ──────────────────────────────────────────────────────────────
.jira_sync_base:
  stage: sync
  image:
    name: curlimages/curl:8.10.1
    entrypoint: [""]
  allow_failure: true
  before_script:
    - |
      if [ -z "$JIRA_SYNC_TOKEN" ] || [ -z "$JIRA_SYNC_EMAIL" ]; then
        echo "WARN: JIRA_SYNC_EMAIL / JIRA_SYNC_TOKEN 미설정 — Jira 동기화를 건너뜁니다."
        echo "설정 위치: Settings → CI/CD → Variables (docs/jira-gitlab-workflow.md §6)"
        exit 0
      fi
    - |
      jira() { # method path [json]
        _m="$1"; _p="$2"; _d="$3"
        if [ -n "$_d" ]; then
          curl -sS -w "\n%{http_code}" -X "$_m" -u "$JIRA_SYNC_EMAIL:$JIRA_SYNC_TOKEN" \
            -H "Content-Type: application/json" "$JIRA_SITE$_p" -d "$_d"
        else
          curl -sS -w "\n%{http_code}" -X "$_m" -u "$JIRA_SYNC_EMAIL:$JIRA_SYNC_TOKEN" \
            -H "Content-Type: application/json" "$JIRA_SITE$_p"
        fi
      }
    - |
      transition_to() { # key status_name — 대상 상태로 전환 (이미 그 상태면 전환 후보에 없어 no-op)
        _key="$1"; _status="$2"
        _tid=$(jira GET "/rest/api/2/issue/$_key/transitions" | grep -oE "\"id\":\"[0-9]+\",\"name\":\"$_status\"" | grep -oE '[0-9]+' | head -1)
        if [ -n "$_tid" ]; then
          jira POST "/rest/api/2/issue/$_key/transitions" "{\"transition\":{\"id\":\"$_tid\"}}" > /dev/null
          echo "Jira $_key → 상태 '$_status' 전환"
        else
          echo "Jira $_key: '$_status' 전환 불필요(이미 해당 상태) 또는 전환 없음 — 상태 변경 안 함"
        fi
      }
    - |
      label() { # key add|remove label_name
        _key="$1"; _op="$2"; _name="$3"
        jira PUT "/rest/api/2/issue/$_key" "{\"update\":{\"labels\":[{\"$_op\":\"$_name\"}]}}" > /dev/null
        echo "Jira $_key: 라벨 $_op $_name"
      }

# 작업 브랜치 push → In Progress (상태 '진행 중')
jira-sync-in-progress:
  extends: .jira_sync_base
  rules:
    - when: never
  script:
    - KEY=$(echo "$CI_COMMIT_BRANCH" | grep -oE "$JIRA_KEY_REGEX" | head -1)
    - echo "브랜치 $CI_COMMIT_BRANCH → 이슈 $KEY"
    - transition_to "$KEY" "진행 중"

# develop/main 대상 MR 생성·갱신 → In Review (상태 '진행 중' + 라벨 in-review)
jira-sync-in-review:
  extends: .jira_sync_base
  rules:
    - when: never
  script:
    - |
      KEY=$(echo "$CI_MERGE_REQUEST_TITLE" | grep -oE "$JIRA_KEY_REGEX" | head -1)
      [ -z "$KEY" ] && KEY=$(echo "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" | grep -oE "$JIRA_KEY_REGEX" | head -1)
      if [ -z "$KEY" ]; then echo "Jira Key 없음 — 상태 변경 안 함"; exit 0; fi
      echo "MR → 이슈 $KEY"
      transition_to "$KEY" "진행 중"
      label "$KEY" add in-review

# develop/main 으로 merge 완료 → Ready for Deploy (라벨 교체)
#   merge commit 메시지에 MR 제목(=Jira Key)이 포함되는 것을 이용한다.
#   단순 커밋에는 반응하지 않도록 merge commit(부모 2개)일 때만 동작한다.
jira-sync-ready-for-deploy:
  extends: .jira_sync_base
  image:
    name: alpine/git:2.45.2
    entrypoint: [""]
  rules:
    - when: never
  script:
    - apk add --no-cache curl > /dev/null 2>&1 || true
    - |
      PARENTS=$(git cat-file -p "$CI_COMMIT_SHA" | grep -c '^parent ' || true)
      if [ "$PARENTS" -lt 2 ]; then
        echo "merge commit 아님(단순 push) — Jira 상태 변경 안 함"; exit 0
      fi
      KEYS=$(echo "$CI_COMMIT_MESSAGE" | grep -oE "$JIRA_KEY_REGEX" | sort -u)
      if [ -z "$KEYS" ]; then echo "커밋 메시지에 Jira Key 없음 — 상태 변경 안 함"; exit 0; fi
      for KEY in $KEYS; do
        echo "merge → 이슈 $KEY"
        label "$KEY" remove in-review
        label "$KEY" add ready-for-deploy
      done

.component-ci:
  interruptible: true
  before_script:
    - command -v python3 >/dev/null || (apt-get update && apt-get install -y --no-install-recommends python3 && rm -rf /var/lib/apt/lists/*)
    - bash infra/jenkins/scripts/secret-scan.sh --path .
    - export CI_BRANCH="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-$CI_COMMIT_REF_NAME}"
    - export CI_RUN_ID="${CI_PIPELINE_ID}-${CI_JOB_ID}"
    - export CI_ARTIFACT_DIR="${CI_PROJECT_DIR}/artifacts/${CI_JOB_NAME}"
    - mkdir -p "$CI_ARTIFACT_DIR"
  # 리포트를 올려 두고도 파싱하지 않으면 MR 화면의 test_report 가 빈 결과로 남는다. ai 가
  # --junitxml 로 만들던 tests.xml 이 그 상태였다. 여기 한 곳에 걸어 back·ai 를 함께 덮는다.
  # front·game 은 매칭되는 파일이 없어 경고만 뜨고 job 은 실패하지 않는다 (GitLab #190).
  artifacts:
    when: always
    paths:
      - artifacts/
    reports:
      junit:
        - artifacts/*/TEST-*.xml
        - artifacts/*/tests.xml

# A valid MR must always publish a successful pipeline status so protected
# develop does not treat an infra/docs-only MR as a skipped pipeline.
mr-status:
  stage: validate
  image: alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apk add --no-cache bash python3
  script:
    - bash infra/jenkins/scripts/secret-scan.sh --path .
    - echo 'MR pipeline status only; component CI is selected by rules:changes'

.front-changes:
  rules:
    # 긴급 규약 — 파트 브랜치 대상 MR 에서는 컴포넌트 CI 를 돌리지 않는다 (workflow rules 주석).
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME != "develop"'
      when: never
    - changes:
        - festa-frontend/**/*
        - ci/**/*
        - .gitlab-ci.yml

.back-changes:
  rules:
    # 긴급 규약 — develop 대상 MR 에서만 (workflow rules 주석).
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME != "develop"'
      when: never
    - changes:
        - backend/**/*
        - ci/**/*
        - .gitlab-ci.yml

.ai-changes:
  rules:
    # 긴급 규약 — develop 대상 MR 에서만 (workflow rules 주석).
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME != "develop"'
      when: never
    - changes:
        - festa-ai/**/*
        - ci/**/*
        - .gitlab-ci.yml

.game-changes:
  rules:
    # 긴급 규약 — develop 대상 MR 에서만 (workflow rules 주석). Unity dispatch 가 Jenkins 를 최대
    # 45분 붙잡으므로 파트 브랜치 구간에서 가장 먼저 빠져야 할 잡이다.
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME != "develop"'
      when: never
    - changes:
        - festa-unity/**/*
        - ci/test
        - ci/lib.sh

unity-mr-validation-dispatch:
  extends: .game-changes
  stage: test
  image: alpine:3.20
  timeout: 45m
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      : "${JENKINS_UNITY_VALIDATION_URL:?set GitLab CI/CD variable}"
      : "${JENKINS_UNITY_VALIDATION_USER:?set GitLab CI/CD variable}"
      : "${JENKINS_UNITY_VALIDATION_API_TOKEN:?set GitLab CI/CD variable}"
      base_url="${JENKINS_UNITY_VALIDATION_URL%/}"
      headers="$(mktemp)"
      trap 'rm -f "$headers"' EXIT
      curl --fail --silent --show-error --dump-header "$headers" --output /dev/null --request POST \
        --user "${JENKINS_UNITY_VALIDATION_USER}:${JENKINS_UNITY_VALIDATION_API_TOKEN}" \
        --data-urlencode "SOURCE_SHA=${CI_COMMIT_SHA}" \
        --data-urlencode "SOURCE_BRANCH=${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}" \
        --data-urlencode "MR_IID=${CI_MERGE_REQUEST_IID}" \
        "${base_url}/job/${JENKINS_UNITY_VALIDATION_JOB}/buildWithParameters"
      queue_url="$(awk 'BEGIN { IGNORECASE=1 } /^Location:/ { sub(/\r$/, "", $2); print $2 }' "$headers")"
      test -n "$queue_url"
      case "$queue_url" in http://*|https://*) ;; *) queue_url="${base_url}${queue_url}" ;; esac
      deadline=$(( $(date +%s) + 2400 ))
      while [ "$(date +%s)" -lt "$deadline" ]; do
        queue="$(curl --fail --silent --show-error --user "${JENKINS_UNITY_VALIDATION_USER}:${JENKINS_UNITY_VALIDATION_API_TOKEN}" "${queue_url}api/json")"
        test "$(printf '%s' "$queue" | jq -r '.cancelled // false')" = false || { printf '%s\n' "$queue" | jq -r '.why // "Jenkins queue cancelled"' >&2; exit 1; }
        build_url="$(printf '%s' "$queue" | jq -r '.executable.url // empty')"
        test -n "$build_url" && break
        sleep 2
      done
      test -n "${build_url:-}" || { echo 'Jenkins Unity validation queue timeout' >&2; exit 1; }
      while [ "$(date +%s)" -lt "$deadline" ]; do
        build="$(curl --fail --silent --show-error --user "${JENKINS_UNITY_VALIDATION_USER}:${JENKINS_UNITY_VALIDATION_API_TOKEN}" "${build_url}api/json")"
        building="$(printf '%s' "$build" | jq -r '.building')"
        test "$building" = false && break
        sleep 5
      done
      test "${building:-true}" = false || { echo 'Jenkins Unity validation timeout' >&2; exit 1; }
      result="$(printf '%s' "$build" | jq -r '.result // "UNKNOWN"')"
      echo "Jenkins Unity validation: ${build_url} (${result})"
      test "$result" = SUCCESS

ai-test:
  extends:
    - .component-ci
    - .ai-changes
  stage: test
  image: python:3.13-slim
  variables:
    CI_COMPONENT: ai
  script:
    - bash ci/test

ai-build:
  extends:
    - .component-ci
    - .ai-changes
  stage: build
  image: python:3.13-slim
  variables:
    CI_COMPONENT: ai
  needs:
    - ai-test
  script:
    - bash ci/build

front-test:
  extends:
    - .component-ci
    - .front-changes
  stage: test
  image: node:24-bookworm-slim
  variables:
    CI_COMPONENT: front
  script:
    - bash ci/test

front-build:
  extends:
    - .component-ci
    - .front-changes
  stage: build
  image: node:24-bookworm-slim
  variables:
    CI_COMPONENT: front
  needs:
    - front-test
  script:
    - bash ci/build

back-test:
  extends:
    - .component-ci
    - .back-changes
  stage: test
  image: maven:3.9-eclipse-temurin-21
  variables:
    CI_COMPONENT: back
    TESTCONTAINERS_HOST_OVERRIDE: 127.0.0.1
  script:
    - bash ci/test

back-build:
  extends:
    - .component-ci
    - .back-changes
  stage: build
  image: maven:3.9-eclipse-temurin-21
  variables:
    CI_COMPONENT: back
  needs:
    - back-test
  script:
    - bash ci/build
