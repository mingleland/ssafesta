# Redis는 재생성 가능한 임시 상태를 보관하되, 컨테이너 재시작 시 로그인 세션 증발을 방지하기 위해 AOF 영속성을 켠다.
bind 0.0.0.0
protected-mode yes
port 6379
aclfile /usr/local/etc/redis/users.acl
maxmemory-policy noeviction
# AOF 영속성 (infra-001 plan.md 결정, S15P21A604-185): 컨테이너 재시작 시 세션 키 일괄 소멸 방지.
appendonly yes
appendfsync everysec
save ""
