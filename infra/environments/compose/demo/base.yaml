name: festa-demo

# Compose merges this project definition with exactly one component overlay.
# game 은 여기 없다 — Dedicated Server 는 infra-003 의 festa-demo-world 프로젝트가 소유한다.
services: {}

networks:
  ai-back:
    name: festa-demo-ai-back-private
  front-private:
    name: festa-demo-front-private
    # 내부 전용(internal) 네트워크로 두지 않는다 — 그러면 Docker 가 DNAT 를 걸지 않아
    # front.yaml 의 127.0.0.1:18080 게시가 조용히 사라진다. 컨테이너는 healthy 인데
    # Nginx 는 502 를 낸다 (2026-09-18 실측).
