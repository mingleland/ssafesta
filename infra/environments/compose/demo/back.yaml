# demo Backend. POSTGRES_*·REDIS_*·ROOT_DOMAIN·WORLD_* 는 COMPONENT_ENV_FILE(demo-back.env)이 정본이다.
# 내부 서비스 토큰만 Jenkins Credentials 에서 프로세스 환경으로 들어온다.
services:
  back:
    image: ${COMPONENT_IMAGE_REF:?COMPONENT_IMAGE_REF is required}
    restart: unless-stopped
    profiles: [back]
    labels:
      com.ssafy-festa.environment: demo
      com.ssafy-festa.owner: infra-002
      com.ssafy-festa.release-id: ${RELEASE_ID:?RELEASE_ID is required}
      com.ssafy-festa.source-commit: ${SOURCE_COMMIT:?SOURCE_COMMIT is required}
      com.ssafy-festa.mock-components: ${DEV_MOCK_COMPONENTS:-}
    ports:
      - "127.0.0.1:${DEMO_BACK_HOST_PORT:-18081}:8080"
    env_file:
      - ${COMPONENT_ENV_FILE:?COMPONENT_ENV_FILE is required}
    environment:
      FESTA_ENVIRONMENT: demo
      SPRING_PROFILES_ACTIVE: infra
      AI_INTERNAL_BASE_URL: http://ai:8000
      INTERNAL_SPRING_TO_AI_TOKENS: ${INTERNAL_SPRING_TO_AI_TOKENS:?INTERNAL_SPRING_TO_AI_TOKENS is required}
      INTERNAL_AI_TO_SPRING_TOKENS: ${INTERNAL_AI_TO_SPRING_TOKENS:?INTERNAL_AI_TO_SPRING_TOKENS is required}
      INTERNAL_INFRA_TO_SPRING_TOKENS: ${INTERNAL_INFRA_TO_SPRING_TOKENS:?INTERNAL_INFRA_TO_SPRING_TOKENS is required}
      DEV_MOCK_COMPONENTS: ${DEV_MOCK_COMPONENTS:-}
    networks:
      ai-back:
        aliases: [back]
      data-private: {}
    mem_limit: ${DEMO_BACK_MEMORY_LIMIT:-1g}
    cpus: ${DEMO_BACK_CPU_LIMIT:-1.0}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  data-private:
    external: true
    name: festa-data-private
