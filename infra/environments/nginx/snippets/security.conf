# T065: Nginx 공통 보안 헤더 및 민감 경로 차단

# 1. 서버 정보 숨김
server_tokens off;

# 2. 필수 보안 헤더
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# 3. 민감한 숨김 파일 및 버전 관리 디렉터리 접근 차단 (.git, .env, .svn 등)
location ~ /\.(?!well-known) {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

# 4. Spring Actuator / 내부 관리자 경로 외부 접근 차단
location ~* ^/(actuator|admin|_profiler) {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}