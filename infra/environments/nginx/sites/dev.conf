# Include this file only from the HTTP server that receives the EC2 public-IP
# dev entry.  Before enabling it, place one or more `allow <approved CIDR>;`
# lines in /etc/nginx/festa/dev-allowlist/*.conf.  With no matching allowlist
# file, the final deny rule keeps every dev route closed.

location = /__dev {
    return 404;
}

location = /__dev/front {
    return 301 /__dev/front/;
}

location /__dev/front/ {
    include /etc/nginx/festa/dev-allowlist/*.conf;
    deny all;
    add_header Cache-Control "no-store" always;
    proxy_pass http://127.0.0.1:3001/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location /__dev/api/ {
    include /etc/nginx/festa/dev-allowlist/*.conf;
    deny all;
    add_header Cache-Control "no-store" always;
    proxy_pass http://127.0.0.1:8081/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location /__dev/ai/ {
    include /etc/nginx/festa/dev-allowlist/*.conf;
    deny all;
    add_header Cache-Control "no-store" always;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location /__dev/world/ {
    include /etc/nginx/festa/dev-allowlist/*.conf;
    deny all;
    add_header Cache-Control "no-store" always;
    proxy_pass http://127.0.0.1:7777/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
