# Include this file only from the HTTPS server for dev.${ROOT_DOMAIN}. Before
# enabling it, place one or more `allow <approved CIDR>;`
# lines in /etc/nginx/festa/dev-allowlist/*.conf.  With no matching allowlist
# file, the final deny rule keeps every dev route closed.

location = /unity {
    include /etc/nginx/festa/dev-allowlist/*.conf;
    deny all;
    return 301 /unity/;
}

location = /unity/manifest.json {
    include /etc/nginx/festa/dev-allowlist/*.conf;
    deny all;
    alias /srv/festa/webgl/current/manifest.json;
    default_type application/json;
    add_header Cache-Control "no-cache" always;
}

location = /unity/index.html {
    include /etc/nginx/festa/dev-allowlist/*.conf;
    deny all;
    alias /srv/festa/webgl/current/index.html;
    default_type text/html;
    add_header Cache-Control "no-cache" always;
}

location ~ ^/unity/Build/([^/]+\.wasm)$ {
    include /etc/nginx/festa/dev-allowlist/*.conf;
    deny all;
    alias /srv/festa/webgl/current/Build/$1;
    default_type application/wasm;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ~ ^/unity/Build/([^/]+\.wasm)\.(br|unityweb)$ {
    include /etc/nginx/festa/dev-allowlist/*.conf;
    deny all;
    alias /srv/festa/webgl/current/Build/$1.$2;
    default_type application/wasm;
    add_header Content-Encoding br always;
    add_header Vary Accept-Encoding always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ~ ^/unity/Build/([^/]+\.js)\.(br|unityweb)$ {
    include /etc/nginx/festa/dev-allowlist/*.conf;
    deny all;
    alias /srv/festa/webgl/current/Build/$1.$2;
    default_type application/javascript;
    add_header Content-Encoding br always;
    add_header Vary Accept-Encoding always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ~ ^/unity/Build/([^/]+\.data)\.(br|unityweb)$ {
    include /etc/nginx/festa/dev-allowlist/*.conf;
    deny all;
    alias /srv/festa/webgl/current/Build/$1.$2;
    default_type application/octet-stream;
    add_header Content-Encoding br always;
    add_header Vary Accept-Encoding always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location /unity/Build/ {
    include /etc/nginx/festa/dev-allowlist/*.conf;
    deny all;
    alias /srv/festa/webgl/current/Build/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location /unity/ {
    include /etc/nginx/festa/dev-allowlist/*.conf;
    deny all;
    alias /srv/festa/webgl/current/;
    add_header Cache-Control "no-cache" always;
}

location / {
    include /etc/nginx/festa/dev-allowlist/*.conf;
    deny all;
    add_header Cache-Control "no-store" always;
    proxy_pass http://127.0.0.1:3001/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location /api/ {
    include /etc/nginx/festa/dev-allowlist/*.conf;
    deny all;
    add_header Cache-Control "no-store" always;
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location /ai/v1/ {
    include /etc/nginx/festa/dev-allowlist/*.conf;
    deny all;
    add_header Cache-Control "no-store" always;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
