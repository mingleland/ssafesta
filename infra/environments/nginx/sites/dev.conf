# Include this file only from the HTTPS server for dev.${ROOT_DOMAIN}. Before
# enabling it, place one or more `allow <approved CIDR>;`
# lines in /etc/nginx/festa/dev-allowlist/*.conf.  With no matching allowlist
# file, the final deny rule keeps every dev route closed.

location / {
    include /etc/nginx/festa/dev-allowlist/*.conf;
    deny all;
    add_header Cache-Control "no-store" always;
    proxy_pass http://127.0.0.1:3001/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location /api/ {
    include /etc/nginx/festa/dev-allowlist/*.conf;
    deny all;
    add_header Cache-Control "no-store" always;
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location /ai/v1/ {
    include /etc/nginx/festa/dev-allowlist/*.conf;
    deny all;
    add_header Cache-Control "no-store" always;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
