# Include this file only from the HTTPS server for dev.${ROOT_DOMAIN}. Before
# enabling it, place one or more `allow <approved CIDR>;`
# lines in /etc/nginx/festa/dev-allowlist/*.conf.  With no matching allowlist
# file, the final deny rule keeps every dev route closed.

# Trust the real client address only when Cloudflare supplied it from one of
# its published proxy networks; the allowlist below must never trust an
# arbitrary forwarded header.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

location = /unity {
    include /etc/nginx/festa/dev-allowlist/*.conf;
    deny all;
    return 301 /unity/;
}

location = /unity/manifest.json {
    include /etc/nginx/festa/dev-allowlist/*.conf;
    deny all;
    alias /srv/festa/webgl/current/manifest.json;
    default_type application/json;
    add_header Cache-Control "no-cache" always;
}

location = /unity/index.html {
    include /etc/nginx/festa/dev-allowlist/*.conf;
    deny all;
    alias /srv/festa/webgl/current/index.html;
    default_type text/html;
    add_header Cache-Control "no-cache" always;
}

location ~ ^/unity/Build/([^/]+\.wasm)$ {
    include /etc/nginx/festa/dev-allowlist/*.conf;
    deny all;
    alias /srv/festa/webgl/current/Build/$1;
    default_type application/wasm;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ~ ^/unity/Build/([^/]+\.wasm)\.(br|unityweb)$ {
    include /etc/nginx/festa/dev-allowlist/*.conf;
    deny all;
    alias /srv/festa/webgl/current/Build/$1.$2;
    default_type application/wasm;
    add_header Content-Encoding br always;
    add_header Vary Accept-Encoding always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ~ ^/unity/Build/([^/]+\.js)\.(br|unityweb)$ {
    include /etc/nginx/festa/dev-allowlist/*.conf;
    deny all;
    alias /srv/festa/webgl/current/Build/$1.$2;
    default_type application/javascript;
    add_header Content-Encoding br always;
    add_header Vary Accept-Encoding always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ~ ^/unity/Build/([^/]+\.data)\.(br|unityweb)$ {
    include /etc/nginx/festa/dev-allowlist/*.conf;
    deny all;
    alias /srv/festa/webgl/current/Build/$1.$2;
    default_type application/octet-stream;
    add_header Content-Encoding br always;
    add_header Vary Accept-Encoding always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location /unity/Build/ {
    include /etc/nginx/festa/dev-allowlist/*.conf;
    deny all;
    alias /srv/festa/webgl/current/Build/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location /unity/ {
    include /etc/nginx/festa/dev-allowlist/*.conf;
    deny all;
    alias /srv/festa/webgl/current/;
    add_header Cache-Control "no-cache" always;
}

location / {
    include /etc/nginx/festa/dev-allowlist/*.conf;
    deny all;
    add_header Cache-Control "no-store" always;
    proxy_pass http://127.0.0.1:3001/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location /api/ {
    include /etc/nginx/festa/dev-allowlist/*.conf;
    deny all;
    add_header Cache-Control "no-store" always;
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location /ai/v1/ {
    include /etc/nginx/festa/dev-allowlist/*.conf;
    deny all;
    add_header Cache-Control "no-store" always;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
