name: festa-observability
services:
  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.18.0}
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy"]
    restart: unless-stopped
    networks: [observability-private]
    volumes:
      - ./alloy:/etc/alloy:ro
      - alloy-data:/var/lib/alloy
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - /:/host/root:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    healthcheck:
      test: ["CMD", "/bin/alloy", "fmt", "--test", "/etc/alloy/config.alloy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits: {cpus: "${ALLOY_CPU_LIMIT:?approve after baseline}", memory: "${ALLOY_MEMORY_LIMIT:?approve after baseline}"}
  alloy-cadvisor:
    profiles: [container-metrics]
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.18.0}
    command: ["run", "/etc/alloy/cadvisor.alloy", "--storage.path=/var/lib/alloy"]
    restart: unless-stopped
    privileged: true
    networks: [observability-private]
    volumes:
      - ./alloy/cadvisor.alloy:/etc/alloy/cadvisor.alloy:ro
      - alloy-cadvisor-data:/var/lib/alloy
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    healthcheck:
      test: ["CMD", "/bin/alloy", "fmt", "--test", "/etc/alloy/cadvisor.alloy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits: {cpus: "${ALLOY_CADVISOR_CPU_LIMIT:?approve after baseline}", memory: "${ALLOY_CADVISOR_MEMORY_LIMIT:?approve after baseline}"}
  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.7.4}
    command: ["-config.file=/etc/loki/config.yaml", "-config.expand-env=true"]
    restart: unless-stopped
    networks: [observability-private]
    environment:
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:?approve after baseline}
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/var/lib/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3100/ready >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits: {cpus: "${LOKI_CPU_LIMIT:?approve after baseline}", memory: "${LOKI_MEMORY_LIMIT:?approve after baseline}"}
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.12.0}
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:?approve after baseline}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:?approve after baseline}
      - --web.enable-remote-write-receiver
      - --web.listen-address=0.0.0.0:9090
    restart: unless-stopped
    networks: [observability-private]
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "promtool", "check", "ready"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits: {cpus: "${PROMETHEUS_CPU_LIMIT:?approve after baseline}", memory: "${PROMETHEUS_MEMORY_LIMIT:?approve after baseline}"}
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.1.0}
    restart: unless-stopped
    networks: [observability-private, observability-egress]
    ports: ["127.0.0.1:${GRAFANA_LOOPBACK_PORT:-3000}:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      MATTERMOST_WEBHOOK_URL: ${MATTERMOST_WEBHOOK_URL:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits: {cpus: "${GRAFANA_CPU_LIMIT:?approve after baseline}", memory: "${GRAFANA_MEMORY_LIMIT:?approve after baseline}"}
networks:
  observability-private:
    name: festa-observability-private
    internal: true
  observability-egress:
    name: festa-observability-egress
volumes:
  alloy-data: {name: festa-observability-alloy}
  alloy-cadvisor-data: {name: festa-observability-alloy-cadvisor}
  loki-data: {name: festa-observability-loki}
  prometheus-data: {name: festa-observability-prometheus}
  grafana-data: {name: festa-observability-grafana}
