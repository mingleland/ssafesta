name: festa-jenkins-controller

services:
  jenkins-controller:
    build:
      context: ..
      dockerfile: controller/Dockerfile
      args:
        JENKINS_IMAGE: ${JENKINS_IMAGE:?load infra/versions.env}
    image: festa/jenkins-controller:${JENKINS_CONTROLLER_TAG:-local}
    container_name: festa-jenkins-controller
    restart: unless-stopped
    environment:
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc_configs
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:?set in infra/.env}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?set in infra/.env}
      JENKINS_UNITY_MR_VALIDATOR_PASSWORD: ${JENKINS_UNITY_MR_VALIDATOR_PASSWORD:?set in infra/.env}
      JENKINS_WEBGL_PUBLISHER_PASSWORD: ${JENKINS_WEBGL_PUBLISHER_PASSWORD:?set in infra/.env}
      JENKINS_UNITY_MR_PIPELINE_BRANCH: ${JENKINS_UNITY_MR_PIPELINE_BRANCH:-develop}
      JENKINS_PUBLIC_URL: ${JENKINS_PUBLIC_URL:?set in infra/.env}
      GITHUB_CREDENTIALS_ID: ${GITHUB_CREDENTIALS_ID:-github-scm}
      GITLAB_CREDENTIALS_ID: ${GITLAB_CREDENTIALS_ID:-gitlab-scm}
      GITLAB_API_CREDENTIALS_ID: ${GITLAB_API_CREDENTIALS_ID:-gitlab-api}
      GITLAB_CHECKOUT_CREDENTIALS_ID: ${GITLAB_CHECKOUT_CREDENTIALS_ID:-gitlab-checkout}
      GITLAB_PACKAGE_READ_CREDENTIAL_ID: ${GITLAB_PACKAGE_READ_CREDENTIAL_ID:-gitlab-package-read}
      GITLAB_API_V4_URL: ${GITLAB_API_V4_URL:-https://lab.ssafy.com/api/v4}
      GITLAB_PROJECT_ID: ${GITLAB_PROJECT_ID:-1443023}
      GITLAB_PROJECT_OWNER: ${GITLAB_PROJECT_OWNER:-CONFIGURE_ME}
      GITLAB_PROJECT_PATH: ${GITLAB_PROJECT_PATH:-CONFIGURE_ME}
      DEPLOY_CREDENTIALS_ID: ${DEPLOY_CREDENTIALS_ID:-deploy-host}
      MATTERMOST_CREDENTIALS_ID: ${MATTERMOST_CREDENTIALS_ID:-mattermost-webhook}
      DEV_BACK_ENV_CREDENTIAL_ID: ${DEV_BACK_ENV_CREDENTIAL_ID:?set in infra/.env}
      DEV_AI_ENV_CREDENTIAL_ID: ${DEV_AI_ENV_CREDENTIAL_ID:?set in infra/.env}
      DEV_INTERNAL_SPRING_TO_AI_TOKENS_CREDENTIAL_ID: ${DEV_INTERNAL_SPRING_TO_AI_TOKENS_CREDENTIAL_ID:?set in infra/.env}
      DEV_INTERNAL_AI_TO_SPRING_TOKENS_CREDENTIAL_ID: ${DEV_INTERNAL_AI_TO_SPRING_TOKENS_CREDENTIAL_ID:?set in infra/.env}
      DEV_INTERNAL_INFRA_TO_SPRING_TOKENS_CREDENTIAL_ID: ${DEV_INTERNAL_INFRA_TO_SPRING_TOKENS_CREDENTIAL_ID:?set in infra/.env}
      DEMO_BACK_ENV_CREDENTIAL_ID: ${DEMO_BACK_ENV_CREDENTIAL_ID:?set in infra/.env}
      DEMO_AI_ENV_CREDENTIAL_ID: ${DEMO_AI_ENV_CREDENTIAL_ID:?set in infra/.env}
      DEMO_INTERNAL_SPRING_TO_AI_TOKENS_CREDENTIAL_ID: ${DEMO_INTERNAL_SPRING_TO_AI_TOKENS_CREDENTIAL_ID:?set in infra/.env}
      DEMO_INTERNAL_AI_TO_SPRING_TOKENS_CREDENTIAL_ID: ${DEMO_INTERNAL_AI_TO_SPRING_TOKENS_CREDENTIAL_ID:?set in infra/.env}
      DEMO_INTERNAL_INFRA_TO_SPRING_TOKENS_CREDENTIAL_ID: ${DEMO_INTERNAL_INFRA_TO_SPRING_TOKENS_CREDENTIAL_ID:-festa-demo-internal-infra-to-spring-tokens}
      R2_POSTGRES_BACKUP_WRITER_CREDENTIAL_ID: ${R2_POSTGRES_BACKUP_WRITER_CREDENTIAL_ID:-r2-postgres-backup-writer}
      R2_POSTGRES_BACKUP_READER_CREDENTIAL_ID: ${R2_POSTGRES_BACKUP_READER_CREDENTIAL_ID:-r2-postgres-backup-reader}
      POSTGRES_BACKUP_ADMIN_PASSWORD_CREDENTIAL_ID: ${POSTGRES_BACKUP_ADMIN_PASSWORD_CREDENTIAL_ID:-postgres-backup-admin-password}
      MATTERMOST_HOST: ${MATTERMOST_HOST:-mattermost.invalid}
      NOTIFY_OWNERS: ${NOTIFY_OWNERS:-}
      GITLAB_HOST: ${GITLAB_HOST:-gitlab.com}
      GITLAB_SERVER_NAME: ${GITLAB_SERVER_NAME:-festa-gitlab}
      GITLAB_SERVER_URL: ${GITLAB_SERVER_URL:-https://gitlab.com}
      GITLAB_WEBHOOK_SECRET_CREDENTIALS_ID: ${GITLAB_WEBHOOK_SECRET_CREDENTIALS_ID:-gitlab-webhook-secret}
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - jenkins_home:/var/jenkins_home
      - ../casc:/var/jenkins_home/casc_configs:ro
      - ../jobs:/var/jenkins_home/job_dsl:ro
    networks:
      jenkins-control:
        aliases:
          - jenkins-controller
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/login >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    security_opt:
      - no-new-privileges:true

volumes:
  jenkins_home:

networks:
  jenkins-control:
    name: festa-jenkins-control
    driver: bridge
