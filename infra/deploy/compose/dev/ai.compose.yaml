name: festa-dev-ai
services:
  ai:
    image: ${COMPONENT_IMAGE_REF:?}
    restart: unless-stopped
    ports: ["127.0.0.1:${AI_HOST_PORT:-8000}:8000"]
    networks: [ai-back]
    env_file:
      - ${COMPONENT_ENV_FILE:?COMPONENT_ENV_FILE is required}
    environment:
      FESTA_ENVIRONMENT: dev
      SPRING_INTERNAL_BASE_URL: http://back:8080
      INTERNAL_SPRING_TO_AI_TOKENS: ${INTERNAL_SPRING_TO_AI_TOKENS:?INTERNAL_SPRING_TO_AI_TOKENS is required}
      INTERNAL_AI_TO_SPRING_TOKENS: ${INTERNAL_AI_TO_SPRING_TOKENS:?INTERNAL_AI_TO_SPRING_TOKENS is required}
    volumes: [ai_data:/app/data]
    mem_limit: ${AI_MEMORY_LIMIT:-1g}
    cpus: ${AI_CPU_LIMIT:-1.0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ai/v1/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
networks:
  ai-back:
    name: festa-dev-ai-back-private
    external: true
volumes: { ai_data: {} }
