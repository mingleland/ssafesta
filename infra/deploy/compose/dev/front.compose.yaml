name: festa-dev-front
services:
  front:
    image: ${COMPONENT_IMAGE_REF:?}
    restart: unless-stopped
    ports: ["127.0.0.1:${FRONT_HOST_PORT:-3001}:80"]
    networks: [front]
    mem_limit: ${FRONT_MEMORY_LIMIT:-512m}
    cpus: ${FRONT_CPU_LIMIT:-0.75}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
networks: { front: {} }
