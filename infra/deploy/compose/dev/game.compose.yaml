name: festa-dev-game
services:
  game:
    image: ${COMPONENT_IMAGE_REF:?}
    restart: unless-stopped
    ports: ["127.0.0.1:${GAME_HOST_PORT:-7777}:7777"]
    networks: [game]
    environment:
      FESTA_ENVIRONMENT: dev
      WORLD_TRANSPORT: websocket
      WORLD_LISTEN_PORT: "7777"
      WORLD_ID: ${WORLD_ID:-11F}
      WORLD_CHANNEL_ID: ${WORLD_CHANNEL_ID:-11F-01}
      WORLD_MAX_PLAYERS: ${WORLD_MAX_PLAYERS:-40}
      WORLD_ENTRY_TOKEN_ISSUER: ${WORLD_ENTRY_TOKEN_ISSUER:-ssafesta-backend}
      WORLD_ENTRY_TOKEN_AUDIENCE: ${WORLD_ENTRY_TOKEN_AUDIENCE:-ssafesta-world}
      CONNECTION_TOKEN_SECRET_FILE: /run/secrets/connection_token_secret
      WORLD_LEDGER_PATH: ${WORLD_LEDGER_PATH:-/var/lib/festa-world/used-grants.log}
    secrets:
      - source: connection_token_secret
        target: connection_token_secret
        mode: 0400
    volumes:
      - world-replay:/var/lib/festa-world
    mem_limit: ${GAME_MEMORY_LIMIT:-2g}
    cpus: ${GAME_CPU_LIMIT:-1.5}
    healthcheck:
      test: ["CMD-SHELL", "test -x /app/festa-unity.x86_64 && test -w /var/lib/festa-world && pgrep -f festa-unity.x86_64 >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 8
networks: { game: {} }
volumes:
  world-replay:
    name: ${WORLD_REPLAY_LEDGER_VOLUME:-festa-dev-world-replay}
secrets:
  connection_token_secret:
    file: ${CONNECTION_TOKEN_SECRET_FILE:?CONNECTION_TOKEN_SECRET_FILE is required}
