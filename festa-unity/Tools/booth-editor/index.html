<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booth Studio (임시 편집기)</title>
<style>
  :root{
    --bg:#12151c; --panel:#1a1f2a; --panel2:#222836; --line:#2e3646;
    --ink:#e8ecf5; --ink2:#9aa5bb; --accent:#f0a62e; --blue:#4b8ef0;
    --ok:#54be86; --bad:#e8776a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 "Malgun Gothic","Segoe UI",system-ui,sans-serif;display:flex;height:100vh}
  h1{font-size:15px;margin:0 0 2px;letter-spacing:-.01em}
  .sub{font-size:11px;color:var(--ink2);margin-bottom:14px}
  aside{width:280px;flex:0 0 280px;background:var(--panel);border-right:1px solid var(--line);
        padding:16px;overflow-y:auto}
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  .bar{display:flex;gap:8px;align-items:center;padding:10px 16px;
       border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  .grow{flex:1}
  button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
         border-radius:4px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
  button:hover{border-color:var(--blue)}
  button.pri{background:var(--blue);border-color:var(--blue);color:#fff}
  button.warn{background:var(--accent);border-color:var(--accent);color:#1a1200}
  button:disabled{opacity:.4;cursor:not-allowed}
  .cat{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
  .cat button{text-align:left;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .cat button span.dim{color:var(--ink2);font-size:11px;font-variant-numeric:tabular-nums}
  canvas{flex:1;min-height:0;display:block;background:#0d1016}
  .status{padding:8px 16px;border-top:1px solid var(--line);background:var(--panel);
          font-size:12px;color:var(--ink2);min-height:34px;display:flex;align-items:center;gap:10px}
  .status b{color:var(--ink);font-weight:600}
  .status.err b{color:var(--bad)}
  .status.ok b{color:var(--ok)}
  .lbl{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.08em;
       margin:14px 0 6px}
  .row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
  .row label{width:64px;font-size:12px;color:var(--ink2)}
  input[type=text],input[type=number]{background:#0f131b;color:var(--ink);border:1px solid var(--line);
    border-radius:3px;padding:4px 6px;font:inherit;font-size:12px;width:100%}
  input[type=color]{width:36px;height:26px;padding:0;border:1px solid var(--line);
    border-radius:3px;background:none;cursor:pointer}
  .sel{border:1px solid var(--line);border-radius:4px;padding:10px;background:var(--panel2);
       font-size:12px}
  .sel .t{font-weight:600;font-size:13px;margin-bottom:6px}
  .hint{font-size:11px;color:var(--ink2);line-height:1.6;margin-top:12px;
        border-top:1px solid var(--line);padding-top:10px}
  code{background:#0f131b;padding:1px 4px;border-radius:2px;font-size:11px}
</style>
</head>
<body>

<aside>
  <h1>Booth Studio</h1>
  <div class="sub">임시 편집기 · Unity 검증 전용</div>

  <div class="lbl">파츠 추가</div>
  <div class="cat" id="cat"></div>

  <div class="lbl">선택한 오브젝트</div>
  <div class="sel" id="sel">없음</div>

  <div class="lbl">부스 Facade</div>
  <div class="row">
    <label>대표색</label>
    <input type="color" id="fcolor" value="#1677C8">
    <input type="text" id="fcolorHex" value="#1677C8">
  </div>
  <div class="row">
    <label>간판</label>
    <input type="text" id="fsign" value="AI 프로젝트 전시관">
  </div>
  <button id="fsave" style="width:100%">Facade 저장</button>

  <div class="hint">
    드래그로 이동 · 클릭으로 선택 · <code>R</code> 회전 90° · <code>Del</code> 삭제<br>
    격자 스냅 0.25 m · 좌표 단위는 미터(spec 005 C-02)<br>
    최대 12개(FR-010)
  </div>
</aside>

<main>
  <div class="bar">
    <button id="load">Draft 불러오기</button>
    <button id="save" class="pri">Draft 저장</button>
    <button id="publish" class="warn">공개</button>
    <span class="grow"></span>
    <span style="font-size:12px;color:var(--ink2)">
      version <b id="ver" style="color:var(--ink)">0</b> ·
      <b id="cnt" style="color:var(--ink)">0</b>/12
    </span>
    <button id="clear">전체 삭제</button>
  </div>
  <canvas id="cv"></canvas>
  <div class="status" id="st"><b>준비</b></div>
</main>

<script src="editor.js"></script>
</body>
</html>
